<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text</title>
</head>

<body>

<main>

    <h1>Speech to Text</h1>
    <p>COMP3011 Assignment 1</p>

    <section aria-labelledby="recording-heading">
        <h2 id="recording-heading">Audio Recording</h2>
        <button id="recordButton" type="button" aria-describedby="status">Record</button>
        <button id="stopButton" type="button" disabled aria-describedby="status">Stop</button>
        <p id="status" role="status" aria-live="polite" aria-atomic="true">Ready</p>

    </section>

    <section aria-labelledby="transcription-heading">
        <h2 id="transcription-heading">Transcription</h2>
        <p id="transcription" aria-live="polite" aria-atomic="true"></p>
    </section>

</main>

<script>

    let mediaRecorder = null;
    let audioChunks = [];
    let currentStream = null;

    const recordButton = document.getElementById("recordButton");
    const stopButton = document.getElementById("stopButton");
    const status = document.getElementById("status");
    const transcription = document.getElementById("transcription");

    function setStatus(message) {
        status.textContent = message;
    }
    function setRecordingState(recording) {
        recordButton.disabled = recording;
        stopButton.disabled = !recording;
    }
    recordButton.addEventListener("click", async () => {
        transcription.textContent = "";
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setStatus("Audio recording is not supported by this browser.");
            return;
        }
        if (!window.MediaRecorder) {
            setStatus("Audio recording is not supported by this browser.");
            return;
        }
        try {
            currentStream = await navigator.mediaDevices.getUserMedia({audio: true});
            audioChunks = [];
            const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";

            mediaRecorder = new MediaRecorder(currentStream, {
                mimeType: mimeType,
                audioBitsPerSecond: 64000
            });

            mediaRecorder.addEventListener("dataavailable", event => {
                    if (event.data && event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                });

            mediaRecorder.addEventListener("start", () => {
                    setStatus("Recording...");
                    setRecordingState(true);});

            mediaRecorder.addEventListener( "error", event => {
                    console.error("Recording error:", event.error);
                    setStatus("An error occurred while recording. Please try again.");
                    setRecordingState(false);
                    if (currentStream) {
                        currentStream.getTracks().forEach(track => track.stop());
                        currentStream = null;
                    }
                });
            mediaRecorder.addEventListener("stop",async () => {
                    setRecordingState(false);
                    if (currentStream) {
                        currentStream.getTracks().forEach(track => track.stop());
                        currentStream = null;
                    }
                    if (audioChunks.length === 0) {
                        setStatus("No audio was recorded. Please try again.");
                        return;
                    }
                    const audioBlob = new Blob(audioChunks,{type: "audio/webm"});
                    if (audioBlob.size === 0) {
                        setStatus("The recording was empty. Please try again.");
                        return;
                    }
                    const formData = new FormData();
                    formData.append("file",audioBlob,"recording.webm");
                    setStatus("Processing...");
                    recordButton.disabled = true;
                    stopButton.disabled = true;
                    try {
                        const response = await fetch("/api/v1/transcribe",{method: "POST",body: formData});
                        if (!response.ok) {
                            throw new Error("Server returned HTTP " +response.status);
                        }
                        const result = await response.json();
                        if (!result || typeof result.text !== "string" || result.text.trim() === "") {
                            throw new Error("The server returned no transcription.");
                        }
                        transcription.textContent = result.text;
                        setStatus("Transcription complete.");
                    } catch (error) {
                        console.error("Transcription error:",error);
                        transcription.textContent = "";
                        if (error instanceof TypeError) {
                            setStatus("Unable to connect to the server. Please check your connection and try again.");
                        } else {
                            setStatus("Transcription failed. Please try again.");
                        }
                    } finally {
                        recordButton.disabled = false;
                        stopButton.disabled = true;
                    }
                });
            // Produce audio data in approximately 1-second chunks.
            mediaRecorder.start(1000);
        } catch (error) {
            console.error("Microphone error:",error);
            setRecordingState(false);

            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            if (error.name === "NotAllowedError") {
                setStatus("Microphone permission was denied. Please allow microphone access and try again.");
            } else if (error.name === "NotFoundError") {
                setStatus("No microphone was found. Please connect a microphone and try again.");
            } else if (error.name === "NotReadableError") {
                setStatus("The microphone is already being used or cannot be accessed.");
            } else if (error.name === "SecurityError") {
                setStatus("Microphone access was blocked for security reasons.");
            } else {
                setStatus("Unable to access the microphone. Please try again.");
            }
        }
    });

    stopButton.addEventListener("click", () => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            setStatus("Stopping recording...");
            recordButton.disabled = true;
            stopButton.disabled = true;
            mediaRecorder.stop();
        }

    });

</script>

</body>

</html>
